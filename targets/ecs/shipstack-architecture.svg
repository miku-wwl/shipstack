<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Shipstack ECS CodePipeline 项目架构图</title>
  <desc id="desc">展示 Terraform root module、LocalStack、CodePipeline、CodeBuild、ECR、ECS、ALB、Spring Boot 和 CloudWatch Logs 之间的关系。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6fb"/>
      <stop offset="1" stop-color="#c8e5ef"/>
    </linearGradient>
    <linearGradient id="darkBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#277c99"/>
      <stop offset="1" stop-color="#17647f"/>
    </linearGradient>
    <linearGradient id="goldBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#f6e4a7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10384a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#217995"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bb8a19"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8190"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "DengXian", "Noto Sans SC", Arial, sans-serif; fill: #20384a; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 17px; fill: #5d7381; }
      .section { font-size: 21px; font-weight: 700; fill: #176b87; }
      .sectionNo { font-size: 14px; font-weight: 700; fill: white; }
      .boxTitle { font-size: 18px; font-weight: 700; }
      .boxText { font-size: 14px; fill: #48606e; }
      .small { font-size: 12px; fill: #617682; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #294452; }
      .whiteTitle { font-size: 18px; font-weight: 700; fill: white; }
      .whiteText { font-size: 13px; fill: #eaf7fb; }
      .line { stroke: #217995; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lineGold { stroke: #bb8a19; stroke-width: 2.3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowGold); }
      .lineGray { stroke: #6c8190; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowGray); }
      .number { fill: #176b87; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect x="36" y="30" width="1528" height="1060" rx="24" fill="#ffffff" stroke="#c9dce4" stroke-width="2"/>

  <!-- Header -->
  <text x="80" y="86" class="font title">Shipstack ECS CodePipeline 项目架构图</text>
  <text x="80" y="119" class="font subtitle">从一次代码发布，追踪到 ECS 中的容器、ALB 上的 HTTP 请求和 CloudWatch Logs</text>
  <rect x="1272" y="66" width="220" height="42" rx="21" fill="#e8f5f8" stroke="#8cc7d6"/>
  <text x="1382" y="93" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#176b87">学习主线：读图 → 操作 → 验证</text>

  <!-- Section 1 -->
  <circle cx="89" cy="165" r="16" class="number"/>
  <text x="89" y="170" text-anchor="middle" class="font sectionNo">1</text>
  <text x="116" y="172" class="font section">交付链路：源代码如何变成正在运行的镜像</text>
  <text x="116" y="195" class="font small">蓝色实线 = 主要交付流；每个编号都对应一个你可以观察的资源或产物</text>

  <!-- Delivery boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="205" height="118" rx="14" fill="url(#blueBox)" stroke="#25809e" stroke-width="2"/>
    <circle cx="106" cy="247" r="16" class="number"/><text x="106" y="252" text-anchor="middle" class="font sectionNo">1</text>
    <text x="132" y="252" class="font boxTitle">开发者工作区</text>
    <text x="101" y="279" class="font mono">targets/ecs/</text>
    <text x="101" y="298" class="font mono">buildspec.yml</text>
    <text x="101" y="317" class="font mono">release/APP_VERSION</text>

    <rect x="350" y="220" width="205" height="118" rx="14" fill="url(#blueBox)" stroke="#25809e" stroke-width="2"/>
    <circle cx="376" cy="247" r="16" class="number"/><text x="376" y="252" text-anchor="middle" class="font sectionNo">2</text>
    <text x="402" y="252" class="font boxTitle">S3 source artifact</text>
    <text x="371" y="282" class="font boxText">source.zip</text>
    <text x="371" y="304" class="font boxText">CodePipeline Source</text>
    <text x="371" y="326" class="font small">由脚本上传并触发执行</text>

    <rect x="620" y="220" width="230" height="118" rx="14" fill="url(#darkBox)" stroke="#125a73" stroke-width="2"/>
    <circle cx="646" cy="247" r="16" fill="#ffffff"/><text x="646" y="252" text-anchor="middle" class="font sectionNo" fill="#176b87">3</text>
    <text x="672" y="252" class="font whiteTitle">CodePipeline</text>
    <text x="641" y="282" class="font whiteText">Source → Build → Deploy</text>
    <text x="641" y="304" class="font whiteText">传递 SourceOutput / BuildOutput</text>
    <text x="641" y="326" class="font whiteText">不负责编译代码</text>

    <rect x="915" y="220" width="255" height="118" rx="14" fill="url(#darkBox)" stroke="#125a73" stroke-width="2"/>
    <circle cx="941" cy="247" r="16" fill="#ffffff"/><text x="941" y="252" text-anchor="middle" class="font sectionNo" fill="#176b87">4</text>
    <text x="967" y="252" class="font whiteTitle">CodeBuild</text>
    <text x="936" y="282" class="font whiteText">Maven test/package</text>
    <text x="936" y="303" class="font whiteText">Docker build + push</text>
    <text x="936" y="324" class="font whiteText">生成 imagedefinitions.json</text>

    <rect x="1235" y="220" width="250" height="118" rx="14" fill="url(#goldBox)" stroke="#cda32f" stroke-width="2"/>
    <circle cx="1261" cy="247" r="16" fill="#bb8a19"/><text x="1261" y="252" text-anchor="middle" class="font sectionNo">5</text>
    <text x="1287" y="252" class="font boxTitle">ECR 镜像仓库</text>
    <text x="1260" y="282" class="font boxText">shipstack-ecs-demo:v1</text>
    <text x="1260" y="304" class="font boxText">shipstack-ecs-demo:v2</text>
    <text x="1260" y="326" class="font small">版本身份从 release manifest 传入</text>
  </g>

  <path d="M 285 279 L 350 279" class="line"/>
  <path d="M 555 279 L 620 279" class="line"/>
  <path d="M 850 279 L 915 279" class="line"/>
  <path d="M 1170 279 L 1235 279" class="line"/>

  <!-- Section 2 Runtime -->
  <circle cx="89" cy="390" r="16" class="number"/>
  <text x="89" y="395" text-anchor="middle" class="font sectionNo">2</text>
  <text x="116" y="397" class="font section">运行时链路：一条 HTTP 请求如何到达 Spring Boot</text>
  <text x="116" y="420" class="font small">Deploy action 更新 task definition；ECS service 负责维持 desired count=2</text>

  <g filter="url(#shadow)">
    <rect x="80" y="447" width="300" height="205" rx="16" fill="#f7fbfc" stroke="#6daabd" stroke-width="2"/>
    <rect x="80" y="447" width="300" height="38" rx="16" fill="#e3f1f5"/>
    <text x="104" y="473" class="font boxTitle">ECS Cluster / Service</text>
    <text x="104" y="511" class="font boxText">cluster: shipstack-ecs-cluster</text>
    <text x="104" y="534" class="font boxText">service: shipstack-ecs-service</text>
    <text x="104" y="557" class="font boxText">desired count: 2</text>
    <text x="104" y="580" class="font boxText">deployment min healthy: 50%</text>
    <text x="104" y="611" class="font small">任务定义版本由 CodePipeline 部署动作切换</text>
    <text x="104" y="630" class="font small">Terraform lifecycle 忽略 active task_definition</text>

    <rect x="430" y="447" width="235" height="205" rx="16" fill="#f7fbfc" stroke="#6daabd" stroke-width="2"/>
    <text x="454" y="478" class="font boxTitle">ECS Tasks × 2</text>
    <rect x="454" y="500" width="187" height="55" rx="10" fill="url(#blueBox)" stroke="#25809e"/>
    <text x="474" y="523" class="font boxText">task :11（当前）</text>
    <text x="474" y="543" class="font mono">image: ...:v1</text>
    <rect x="454" y="568" width="187" height="55" rx="10" fill="url(#blueBox)" stroke="#25809e"/>
    <text x="474" y="591" class="font boxText">container port 8080</text>
    <text x="474" y="611" class="font mono">/actuator/health</text>

    <rect x="715" y="447" width="235" height="205" rx="16" fill="#f7fbfc" stroke="#6daabd" stroke-width="2"/>
    <text x="739" y="478" class="font boxTitle">ALB</text>
    <text x="739" y="511" class="font boxText">listener: 80</text>
    <text x="739" y="534" class="font boxText">target group → 8080</text>
    <text x="739" y="557" class="font boxText">health check</text>
    <text x="739" y="580" class="font mono">GET /actuator/health</text>
    <text x="739" y="613" class="font small">LocalStack 宿主机出口：4567</text>
    <text x="739" y="632" class="font small">DNS: *.elb.localhost.localstack.cloud</text>

    <rect x="1000" y="447" width="485" height="205" rx="16" fill="url(#goldBox)" stroke="#cda32f" stroke-width="2"/>
    <text x="1026" y="478" class="font boxTitle">用户 / 浏览器 / curl</text>
    <text x="1026" y="513" class="font boxText">http://shipstack-ecs-alb.elb.localhost.localstack.cloud:4567</text>
    <text x="1026" y="545" class="font mono">/api/v1/hello       → message + target</text>
    <text x="1026" y="570" class="font mono">/api/v1/version     → service + APP_VERSION</text>
    <text x="1026" y="595" class="font mono">/actuator/health    → status=UP</text>
    <text x="1026" y="628" class="font small">注意：域名中必须包含 .localhost.，否则会 DNS NXDOMAIN</text>
  </g>

  <path d="M 380 550 L 430 550" class="line"/>
  <path d="M 665 550 L 715 550" class="line"/>
  <path d="M 950 550 L 1000 550" class="line"/>
  <path d="M 850 338 C 850 390 230 390 230 447" class="lineGold"/>
  <text x="510" y="363" class="font small" fill="#9b7212">DeployToECS 读取 imagedefinitions.json，切换 task definition</text>

  <!-- Section 3 IaC and LocalStack boundary -->
  <circle cx="89" cy="713" r="16" class="number"/>
  <text x="89" y="718" text-anchor="middle" class="font sectionNo">3</text>
  <text x="116" y="720" class="font section">基础设施与环境边界：谁负责创建资源，谁负责提供 AWS API</text>

  <g filter="url(#shadow)">
    <rect x="80" y="765" width="440" height="250" rx="16" fill="#f5f9fb" stroke="#8aa9b6" stroke-width="2"/>
    <rect x="80" y="765" width="440" height="42" rx="16" fill="#dcebf0"/>
    <text x="105" y="793" class="font boxTitle">Terraform root module</text>
    <text x="105" y="835" class="font mono">infra/versions.tf  → AWS provider</text>
    <text x="105" y="858" class="font mono">infra/variables.tf → endpoint variables</text>
    <text x="105" y="881" class="font mono">infra/main.tf     → module composition</text>
    <text x="105" y="916" class="font boxText">创建：VPC、ECR、IAM、ECS、ALB、</text>
    <text x="105" y="938" class="font boxText">S3、CodeBuild、CodePipeline、Logs</text>
    <text x="105" y="974" class="font small">子模块只接收标准资源输入，不接收 LocalStack 专用参数</text>
    <text x="105" y="994" class="font small">provider endpoint override 只存在 root 环境边界</text>

    <rect x="600" y="765" width="420" height="250" rx="16" fill="#fbf8ed" stroke="#cda32f" stroke-width="2"/>
    <rect x="600" y="765" width="420" height="42" rx="16" fill="#f5e8b6"/>
    <text x="625" y="793" class="font boxTitle">LocalStack 项目专用运行时</text>
    <text x="625" y="835" class="font boxText">容器：shipstack-ecs-localstack</text>
    <text x="625" y="858" class="font boxText">宿主机：localhost:4567</text>
    <text x="625" y="881" class="font boxText">容器网络：shipstack-ecs-localstack:4566</text>
    <text x="625" y="916" class="font mono">TF_VAR_aws_api_endpoint=localhost:4567</text>
    <text x="625" y="939" class="font mono">TF_VAR_codebuild_aws_endpoint=...:4566</text>
    <text x="625" y="962" class="font mono">TF_VAR_ecr_registry_port=4567</text>
    <text x="625" y="994" class="font small">同一个 LocalStack service 的两个网络视角</text>

    <rect x="1100" y="765" width="385" height="250" rx="16" fill="url(#darkBox)" stroke="#125a73" stroke-width="2"/>
    <text x="1126" y="793" class="font whiteTitle">AWS API 资源面</text>
    <text x="1126" y="834" class="font whiteText">S3 / IAM / STS / EC2 / ECR</text>
    <text x="1126" y="858" class="font whiteText">ECS / ELBv2 / Logs / CloudWatch</text>
    <text x="1126" y="882" class="font whiteText">CodeBuild / CodePipeline</text>
    <line x1="1126" y1="903" x2="1458" y2="903" stroke="#81c5d8"/>
    <text x="1126" y="929" class="font whiteText">Terraform 管理资源生命周期</text>
    <text x="1126" y="953" class="font whiteText">CodePipeline 管理发布时的 active revision</text>
    <text x="1126" y="989" class="font whiteText">本地模拟 AWS API，不等于真实 AWS</text>
  </g>

  <path d="M 520 885 L 600 885" class="lineGold"/>
  <path d="M 1020 885 L 1100 885" class="lineGold"/>
  <path d="M 300 765 C 300 720 270 690 230 652" class="lineGray"/>
  <path d="M 810 765 C 810 720 820 690 830 652" class="lineGray"/>
  <text x="386" y="746" class="font small">provider endpoint override</text>
  <text x="865" y="746" class="font small">运行时 endpoint / registry</text>

  <!-- Section 4 logs -->
  <circle cx="89" cy="1045" r="16" class="number"/>
  <text x="89" y="1050" text-anchor="middle" class="font sectionNo">4</text>
  <text x="116" y="1052" class="font section">可观测性：应用 stdout → awslogs → CloudWatch Logs</text>
  <path d="M 695 652 C 695 690 545 690 545 1040 L 630 1040" class="lineGray"/>
  <rect x="630" y="1022" width="245" height="38" rx="10" fill="#eef5f7" stroke="#98bac5"/>
  <text x="752" y="1047" text-anchor="middle" class="font boxText">Spring Boot stdout</text>
  <path d="M 875 1041 L 945 1041" class="lineGray"/>
  <rect x="945" y="1022" width="245" height="38" rx="10" fill="#eef5f7" stroke="#98bac5"/>
  <text x="1067" y="1047" text-anchor="middle" class="font boxText">ECS awslogs driver</text>
  <path d="M 1190 1041 L 1260 1041" class="lineGray"/>
  <rect x="1260" y="1022" width="225" height="38" rx="10" fill="#eef5f7" stroke="#98bac5"/>
  <text x="1372" y="1047" text-anchor="middle" class="font boxText">CloudWatch Logs</text>

  <!-- Footer learning steps -->
  <rect x="1080" y="112" width="405" height="72" rx="12" fill="#f3f8fa" stroke="#b9d2dc"/>
  <text x="1102" y="137" class="font small" font-weight="700">建议操作顺序</text>
  <text x="1102" y="159" class="font small">① deploy-infra  ② run-pipeline v1  ③ smoke-test</text>
  <text x="1102" y="177" class="font small">④ run-pipeline v2  ⑤ rollback  ⑥ validate-logs</text>

  <text x="80" y="1080" class="font small">Shipstack · ECS Target · LocalStack 本地学习架构图</text>
  <text x="1485" y="1080" text-anchor="end" class="font small">当前回滚状态：v1 · desired=2 · running=2</text>
</svg>
